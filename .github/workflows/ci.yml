name: CI Quality Checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Verify TypeScript & ESLint / Oxlint
        env:
          NODE_OPTIONS: "--experimental-strip-types"
        run: npm run check

      - name: Verify Build
        env:
          NODE_ENV: "production"
          GITHUB_PAGES: "true"
        run: npm run build
